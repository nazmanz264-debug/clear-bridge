<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clear Bridge Legal Pages</title>
<style>
:root { --bg:#f6f8fc;--card:#fff;--text:#162033;--muted:#53627d;--brand:#2563eb;--border:#e5eaf4;--shadow:0 20px 60px rgba(15,23,42,.08); }
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#eef4ff 0%,#f7f9fd 46%,#f9fbff 100%);color:var(--text);line-height:1.7}
.wrap{width:min(940px,calc(100% - 28px));margin:40px auto}.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:34px;box-shadow:var(--shadow)}
.eyebrow{display:inline-block;padding:8px 12px;border-radius:999px;background:#eff6ff;color:var(--brand);font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin-bottom:12px}
h1,h2,h3{line-height:1.2;color:#0f172a}h1{margin:0 0 10px;font-size:clamp(30px,4vw,42px);letter-spacing:-.03em}h2{margin-top:28px;font-size:22px;letter-spacing:-.02em}h3{margin-top:18px;font-size:18px}
p,li{color:var(--text);font-size:16px}.lead{color:var(--muted);margin-top:0;font-size:16px}ul,ol{padding-left:22px}
.info-box{background:#f8fbff;border:1px solid #dfeafb;padding:16px 18px;border-radius:16px;margin:18px 0}.muted{color:var(--muted)}a{color:var(--brand)}
@media (max-width:640px){.wrap{width:min(100% - 16px,940px);margin:16px auto}.card{padding:20px;border-radius:18px}p,li{font-size:15px}}
</style>
</head>
<body>
<main class="wrap"><article class="card">
<div class="eyebrow">Legal Pages</div><h1>Clear Bridge</h1><p class="lead">Official Privacy Policy, Contact, and Account Deletion pages for Clear Bridge.</p><ul><li><a href="privacy-policy.html">Privacy Policy</a></li><li><a href="contact-us.html">Contact Us</a></li><li><a href="account-delete.html">Account Delete</a></li></ul>
</article></main>
</body>
</html>
